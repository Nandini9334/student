apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-records-deployment
  labels:
    app: student-records
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-records
  template:
    metadata:
      labels:
        app: student-records
    spec:
      containers:
        - name: student-records
          image: nandini9334/student-records:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
